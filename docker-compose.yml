# Production-shaped stack: one container, the full image, a named volume for the
# data directory.
#
# One container on purpose. PocketBase serves the API, the Admin UI and the SPA
# from the same origin, which is what lets the web build store its token under
# that origin's CSP and talk to the API with no CORS at all. Splitting them would
# buy nothing and cost both.
services:
  eiermann:
    build:
      context: .
      target: full
    image: eiermann:local
    restart: unless-stopped
    ports:
      # 8091 is eiermann's port, everywhere and by default. federfall's dev stack
      # owns 8090, and `apps/eiermann/dart_defines/development.json` points the
      # app at 8091 — so a default of 8090 here meant the two disagreed and the
      # app could not find its own backend.
      #
      # Still overridable, and still through a variable rather than an override
      # file, because Compose APPENDS port lists rather than replacing them: an
      # override naming a second port makes the stack try to bind both and fail
      # on whichever is taken.
      #
      # Set it in a `.env` file, not as a one-off `EIERMANN_PORT=… docker
      # compose up`. The prefix applies to that single command; the NEXT compose
      # command sees no variable, notices the container's config differs, and
      # recreates it on the default port. That is a confusing way to lose your
      # backend, and it happened while writing this.
      - "${EIERMANN_PORT:-8091}:8090"
    volumes:
      - pb_data:/pb/pb_data
    environment:
      # ── THE FIRST USER ─────────────────────────────────────────────────
      #
      # Set these two and the app creates a coordinator on boot. Without them a
      # fresh instance has no way in: a PocketBase superuser (the Admin UI
      # account) is NOT an app-level coordinator — it is a `_superusers` record
      # with no org and no role, so it cannot own a Spot, invite anybody, or
      # appear in a visit history.
      #
      # Put them in a `.env` file next to this one (see .env.example); it is
      # gitignored, which a compose file is not. Then:
      #
      #     docker compose -f docker-compose.yml up -d --build
      #
      # It is idempotent and doubles as the lockout-recovery path: an existing
      # account is reactivated and re-granted rather than duplicated, and the
      # password is only ever set on creation — so an operator who once used
      # this cannot silently reset a password the team has since changed.
      #
      # Clear them once the team exists. The account stays; credentials left in
      # an environment are how they end up in a backup somebody can read.
      EIERMANN_COORDINATOR_EMAIL: ${EIERMANN_COORDINATOR_EMAIL:-}
      EIERMANN_COORDINATOR_PASSWORD: ${EIERMANN_COORDINATOR_PASSWORD:-}
      # Optional display name. Worth setting: every audit-shaped row stores a
      # text snapshot of its author, so without a name the email address ends up
      # in the visit history of every Spot this account touches.
      EIERMANN_COORDINATOR_NAME: ${EIERMANN_COORDINATOR_NAME:-}
      # Absolute URL of this instance, for the links in reset mail.
      EIERMANN_APP_URL: ${EIERMANN_APP_URL:-http://localhost:8090}
      # SMTP, so password reset can actually deliver. Without a host the server
      # reports passwordReset:false through /info and the app hides the link,
      # rather than offering a button that silently does nothing.
      EIERMANN_SMTP_HOST: ${EIERMANN_SMTP_HOST:-}
      EIERMANN_SMTP_PORT: ${EIERMANN_SMTP_PORT:-587}
      EIERMANN_SMTP_USERNAME: ${EIERMANN_SMTP_USERNAME:-}
      EIERMANN_SMTP_PASSWORD: ${EIERMANN_SMTP_PASSWORD:-}
      EIERMANN_SMTP_TLS: ${EIERMANN_SMTP_TLS:-true}
      EIERMANN_SMTP_SENDER_ADDRESS: ${EIERMANN_SMTP_SENDER_ADDRESS:-}
      # Behind a reverse proxy, name its forwarding header — otherwise every
      # rate limit is shared by all users, because the only client IP PocketBase
      # can see is the proxy's.
      EIERMANN_TRUSTED_PROXY_HEADERS: ${EIERMANN_TRUSTED_PROXY_HEADERS:-}
      # ── THE GEOCODER ───────────────────────────────────────────────────
      #
      # Address → coordinates, for the Spot form and the map. It runs through
      # /api/eiermann/geocode and never from the client: a browser cannot call
      # Nominatim at all (no CORS headers), the upstream wants a real contact in
      # the User-Agent, and a rate limit a client can bypass is not one.
      #
      # BOTH of these want setting before a real deployment. Left empty the
      # proxy talks to the public OSM instance under the User-Agent
      # "eiermann/1.0" — and that instance blocks application backends and
      # placeholder agents, so geocoding works in development and stops the day
      # it matters. Either self-host Nominatim (or point at a paid provider) or
      # put a real contact address in the agent.
      EIERMANN_NOMINATIM_URL: ${EIERMANN_NOMINATIM_URL:-}
      EIERMANN_USER_AGENT: ${EIERMANN_USER_AGENT:-}
      # For a provider that wants a key rather than a contact.
      EIERMANN_GEOCODER_KEY: ${EIERMANN_GEOCODER_KEY:-}
      # The cache in front of it: 30 days for a hit, 24 hours for a miss, purged
      # nightly. Twenty volunteers looking up the same street is one upstream
      # request. Override only to debug — GEOCODE_CACHE_DISABLED=1 turns it off.
      EIERMANN_GEOCODE_CACHE_TTL_DAYS: ${EIERMANN_GEOCODE_CACHE_TTL_DAYS:-}
      EIERMANN_GEOCODE_CACHE_NEG_TTL_HOURS: ${EIERMANN_GEOCODE_CACHE_NEG_TTL_HOURS:-}
      EIERMANN_GEOCODE_CACHE_DISABLED: ${EIERMANN_GEOCODE_CACHE_DISABLED:-}
      # ── THE MAP SOURCE ─────────────────────────────────────────────────
      #
      # ALL OR NOTHING, and prescribed at RUNTIME through /api/eiermann/info
      # rather than baked into the app. A self-hosted server cannot be made to
      # advertise somebody else's tiles, and a half-applied override that named
      # the wrong provider would be a licensing problem, not a cosmetic one — so
      # /info refuses a partial set and the app falls back to its build-time
      # defines instead of mixing the two.
      #
      # Set MAP_MODE (raster|vector), the URL matching that mode, and the
      # attribution the provider requires. The app derives its CSP from the same
      # URLs, so a source named here cannot be blocked by the server that named
      # it.
      EIERMANN_MAP_MODE: ${EIERMANN_MAP_MODE:-}
      EIERMANN_MAP_TILE_URL: ${EIERMANN_MAP_TILE_URL:-}
      EIERMANN_MAP_STYLE_URL: ${EIERMANN_MAP_STYLE_URL:-}
      EIERMANN_MAP_ATTRIBUTION: ${EIERMANN_MAP_ATTRIBUTION:-}
      EIERMANN_MAP_ATTRIBUTION_URL: ${EIERMANN_MAP_ATTRIBUTION_URL:-}
      # Kept out of the committed dart_defines for the obvious reason.
      EIERMANN_MAP_API_KEY: ${EIERMANN_MAP_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pb_data:
