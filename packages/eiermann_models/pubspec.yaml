name: eiermann_models
description: >-
  Immutable domain models for Eiermann plus PocketBase RecordModel → model
  mappers. Pure Dart; no Flutter dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

# Part of the Eiermann pub workspace (see ../../pubspec.yaml).
resolution: workspace

dependencies:
  freezed_annotation: ^3.1.0
  pocketbase: ^0.26.0
  zugvogel_core:
    git:
      url: https://github.com/jhbruhn/zugvogel.git
      ref: a1c55612c488861f9800424efa594e9f3d77c737
      path: packages/zugvogel_core

dev_dependencies:
  build_runner: ^2.15.0
  freezed: ^4.0.3
  test: ^1.25.0
  very_good_analysis: ^11.0.0
