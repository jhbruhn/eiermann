name: eiermann_data
description: >-
  Repository layer for Eiermann: typed interfaces over PocketBase collections
  with model mapping and error translation. Pure Dart; no Flutter dependency.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

# Part of the Eiermann pub workspace (see ../../pubspec.yaml).
resolution: workspace

dependencies:
  eiermann_models:
    path: ../eiermann_models
  http: ^1.3.0
  meta: ^1.16.0
  pocketbase: ^0.24.0
  zugvogel_data:
    git:
      url: https://github.com/jhbruhn/zugvogel.git
      ref: 3498c5de40f4571a14658f6de2811d433e176891
      path: packages/zugvogel_data

dev_dependencies:
  mocktail: ^1.0.5
  test: ^1.25.0
  very_good_analysis: ^10.3.0
