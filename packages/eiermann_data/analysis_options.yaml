include: package:very_good_analysis/analysis_options.yaml

# very_good_analysis 11 switched this to `automate`, which re-wraps every
# hand-placed trailing comma. Keep the layout the code was written in.
formatter:
  trailing_commas: preserve

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
linter:
  rules:
    public_member_api_docs: false
