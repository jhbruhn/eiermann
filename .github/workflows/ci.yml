name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # In lockstep with apps/eiermann's `flutter: ^3.44.0` AND with zugvogel's CI:
  # the shared library is compiled by THIS toolchain, so a version it has not
  # been built against is a break discovered here rather than there.
  FLUTTER_VERSION: "3.44.3"

jobs:
  dart:
    name: format · analyze · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # BEFORE pub, deliberately. A pub workspace resolves one ref per git
      # dependency, so a half-bumped zugvogel pin fails at RESOLUTION — which
      # means no Dart test can ever report it, because none of them run. This
      # says which files disagree and which script fixes it.
      - name: Check the zugvogel pin is aligned
        run: ./tools/check-zugvogel-pin.sh

      # Resolves the whole pub workspace from the repo root, zugvogel's pinned
      # git refs included.
      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n
        working-directory: apps/eiermann

      # Format the hand-written source BEFORE any generated file exists, so the
      # check never trips over generator output.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # build_runner only generates for the package it runs in, so each member
      # with codegen needs its own step.
      #
      # WITHOUT `--delete-conflicting-outputs`: build_runner removed that option,
      # and passing it now only earns a "these options have been removed and
      # were ignored" warning. Left in, it reads as a safeguard that is doing
      # something — and the next person to hit a conflicting-output error would
      # look at the flag, see it already there, and conclude the problem is
      # elsewhere. `guards/codegen_test.dart` fails on any removed flag.
      - name: Generate code (eiermann_models)
        run: dart run build_runner build
        working-directory: packages/eiermann_models

      - name: Generate code (app)
        run: dart run build_runner build
        working-directory: apps/eiermann

      # From the REPO ROOT, so the workspace is analysed as one thing. Running
      # it per package hides a member that only breaks in combination.
      - name: Analyze
        run: flutter analyze

      - name: Test eiermann_models
        run: dart test
        working-directory: packages/eiermann_models

      - name: Test eiermann_data
        run: dart test
        working-directory: packages/eiermann_data

      - name: Test the app
        run: flutter test --coverage
        working-directory: apps/eiermann

      # eiermann-uwd.8. Two checks, and the second is the one that matters:
      # `flutter test --coverage` instruments only the libraries a test actually
      # LOADED, so a file no test imports does not appear in the report at all.
      # It is not counted as uncovered — it is not counted, which means adding a
      # whole untested feature RAISES the percentage. The script fails on both.
      - name: Coverage gate
        run: ./tools/check-coverage.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/eiermann/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: backend · rule & hook tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Builds the pinned PocketBase image, applies the migrations to a
      # throwaway instance, and asserts the access-rule matrix plus the hooks
      # that close what the rules cannot. This is the job that would catch a
      # privilege escalation.
      - name: Run the PocketBase rule suite
        run: backend/pocketbase/tests/run.sh

      # eiermann-m89. Both of these existed and ran in NO ci job, which is the
      # same as not existing: a suite nothing runs is a suite that goes green by
      # rotting.
      #
      # The node tests cover the PURE halves — the rhythm ladder and the
      # settings validation — which the integration suite would need twenty real
      # visits to walk. They need no server, so they run first and fail fast.
      - name: Run the hook unit tests
        run: |
          for test in backend/pocketbase/tests/unit/*_test.js; do
            echo "── $test"
            node "$test"
          done

      # `cronAdd` jobs are invisible to the rule suite — nothing an HTTP request
      # can do triggers one — so this boots an instance with the schedules
      # rewritten and watches a job actually run.
      - name: Run the cron harness
        run: backend/pocketbase/tests/run_cron.sh

  docker:
    name: docker · full image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The rule suite above only ever builds `--target backend`, so the `full`
      # target's Flutter web stage is otherwise unexercised until a release
      # needs it. Build-only, so a break surfaces on the PR rather than on
      # release day.
      - name: Build the full image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: eiermann:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
