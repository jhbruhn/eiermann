name: Release Please

# The version is the APP↔SERVER WIRE CONTRACT, and that is the whole reason this
# repo versions at all.
#
# `zv_info.js` reports the running image's major.minor, and the client refuses to
# talk to a server whose MAJOR differs (zugvogel's checkServerCompatibility). So a
# `!`/BREAKING CHANGE commit is not a formality — it is the statement that an
# older app must stop talking to this server. Which means:
#
#   * bump-minor-pre-major is FALSE. A breaking change bumps the MAJOR even
#     pre-1.0, because the major is what the compatibility check reads. Letting a
#     wire break hide in a minor would let an incompatible pair through silently,
#     which is precisely the failure the check exists to prevent.
#   * the operator's container and the users' installed app update
#     independently, and an unattended APK updater makes the app the newer of the
#     two more often than not. The check has to name which side is behind; the
#     version is how it knows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker:
    name: Publish the image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}

      # EIERMANN_VERSION is baked into the image env, so /api/eiermann/info can
      # report it without any source file needing a release-time edit — the
      # running image IS the source of truth for the version it claims.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          push: true
          build-args: |
            EIERMANN_VERSION=${{ needs.release-please.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Publish the Android APKs
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FLUTTER_VERSION: "3.44.3"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # From the repo ROOT: this is a pub workspace, and resolving inside the app
      # would resolve one member against nothing.
      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (eiermann_models)
        run: dart run build_runner build
        working-directory: packages/eiermann_models

      - name: Generate code (app) + localizations
        run: |
          flutter gen-l10n
          dart run build_runner build
        working-directory: apps/eiermann

      # A release with no keystore configured would otherwise build cheerfully
      # and ship DEBUG-SIGNED APKs — which cannot be upgraded over a properly
      # signed install, so the damage lands on users' phones and is only fixable
      # by making them uninstall. Fail here instead.
      #
      # All FOUR are checked, not just the keystore. Gradle reads the other
      # three straight from the environment (`android/app/build.gradle.kts`),
      # and an unset one reaches it as null — which surfaces four minutes later
      # as a Gradle stack trace naming neither the secret nor this workflow.
      - name: Require a signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_ALIAS \
                      ANDROID_KEYSTORE_PASSWORD \
                      ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -z "$value" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing — an unsigned or" \
                 "debug-signed release cannot be upgraded over an existing" \
                 "install, so this fails here instead. Note that a keystore" \
                 "made by a current keytool is PKCS12, where the key password" \
                 "IS the store password: set both secrets to the same value."
            exit 1
          fi

      # `printf %s` rather than `echo`: some shells' echo eats backslashes, and
      # a keystore that decodes to garbage fails much later and much less
      # legibly (see the verify step).
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # ── Read the keystore HERE, where a failure can say what is wrong ──────
      #
      # A truncated ANDROID_KEYSTORE_BASE64 — the base64 of a keystore is a
      # single ~3.6 kB line, and copying one out of a terminal loses the tail
      # more often than anybody expects — decodes without complaint into a
      # short file. `base64 -d` is happy: the input it got was valid base64.
      #
      # Nothing then notices until Gradle parses it during `packageRelease`,
      # where the truncation surfaces as an EOFException carrying NO message,
      # and AGP interpolates that into:
      #
      #     KeytoolException: Failed to read key *** from store
      #     "/home/runner/work/_temp/release.jks": null
      #
      # A trailing ": null" that says nothing, on a task that has nothing to do
      # with the cause, after a full build has been spent. `keytool -list` reads
      # the same file with the same passwords in a second and names the real
      # problem — and because it also resolves the ALIAS, it catches the other
      # easy mistake: a keystore whose alias is not the one in the secret.
      #
      # Its diagnosis goes to STDOUT, not stderr (measured: `keytool error:
      # java.io.EOFException` on stdout, an empty stderr). Sending stdout to
      # /dev/null and capturing 2> therefore printed a blank "keytool said:".
      - name: Verify the keystore can actually be opened
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
        run: |
          jks="$RUNNER_TEMP/release.jks"
          size=$(wc -c < "$jks")
          echo "decoded keystore: $size bytes"
          if [ "$size" -lt 512 ]; then
            echo "::error::The decoded keystore is only $size bytes, which is" \
                 "too small to be one. ANDROID_KEYSTORE_BASE64 is truncated or" \
                 "empty — regenerate it with 'base64 -w0 your-key.jks' and" \
                 "check the pasted secret is the whole string."
            exit 1
          fi
          if ! keytool -list -keystore "$jks" \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" > keytool.out 2>&1; then
            echo "::error::The keystore did not open. Either" \
                 "ANDROID_KEYSTORE_PASSWORD is wrong or the decoded file is" \
                 "not a keystore (a truncated ANDROID_KEYSTORE_BASE64 reads as" \
                 "corrupt). keytool said:"
            sed 's/^/  /' keytool.out
            exit 1
          fi
          if ! keytool -list -keystore "$jks" \
                 -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                 -alias "$ANDROID_KEYSTORE_ALIAS" > keytool.out 2>&1; then
            echo "::error::The keystore opened but holds no such alias." \
                 "ANDROID_KEYSTORE_ALIAS does not match the key inside it —" \
                 "'keytool -list -keystore your-key.jks' locally prints the" \
                 "aliases it does have. keytool said:"
            sed 's/^/  /' keytool.out
            exit 1
          fi
          echo "keystore opens and holds the configured alias"

      # ── Two builds, and why they cannot be one ─────────────────────────────
      #
      # A universal (fat) APK carries every ABI's native libraries and installs
      # anywhere; the per-ABI splits are roughly a third of that weight.
      # `--split-per-abi` renames the outputs, so it cannot share an invocation
      # with the universal build.
      #
      # Only arm64-v8a and armeabi-v7a are split out — the two ABIs real phones
      # ship. The universal APK still covers the rare x86_64 case, so a third
      # split would be a file nobody downloads.
      #
      # ── The versionCode trap, which is the whole reason this is documented ─
      #
      # Flutter OFFSETS the versionCode per ABI for `--split-per-abi`:
      # armeabi-v7a → 1xxx, arm64-v8a → 2xxx. Measured here, not assumed: with
      # `--build-number=777` the three APKs came out 777 (universal), 1777
      # (armeabi-v7a) and 2777 (arm64-v8a), and the splits were 23.6 MB and
      # 25.7 MB against the universal's 69.1 MB. Each stream is therefore
      # monotonic on its own, and an updater
      # (Obtainium and friends) must keep its APK filter on ONE variant:
      #
      #   universal → arm64      upgrades cleanly (777 → 2777)
      #   arm64     → universal  reads as a DOWNGRADE (2777 → 778) and Android
      #                          refuses it; only a reinstall gets out of that.
      #
      # This is also why the filenames below name the variant explicitly rather
      # than leaving Flutter's `app-arm64-v8a-release.apk`: a person choosing a
      # download is choosing a stream they will stay on.
      - name: Build the signed APKs (universal + per-ABI)
        working-directory: apps/eiermann
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
        run: |
          common=(
            --release
            --target lib/main_production.dart
            --dart-define-from-file=dart_defines/production.json
            --build-name="${{ needs.release-please.outputs.version }}"
            --build-number="${{ github.run_number }}"
          )
          flutter build apk "${common[@]}"
          flutter build apk "${common[@]}" \
            --split-per-abi \
            --target-platform android-arm64,android-arm

      # Trust the build, verify the signer. `build.gradle.kts` falls back to the
      # debug key when it finds no keystore — correct for `flutter run --release`
      # on a laptop, catastrophic in a release — so the one thing worth asserting
      # is that the fallback did NOT happen.
      - name: Verify the APKs are not debug-signed
        working-directory: apps/eiermann/build/app/outputs/flutter-apk
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          status=0
          for apk in app-release.apk app-arm64-v8a-release.apk app-armeabi-v7a-release.apk; do
            echo "── $apk"
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs"
            if grep -qi "CN=Android Debug" <<<"$certs"; then
              echo "::error::$apk is DEBUG-SIGNED — it cannot be upgraded over a real install."
              status=1
            fi
          done
          exit $status

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Attach the APKs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.release-please.outputs.version }}"
          out="apps/eiermann/build/app/outputs/flutter-apk"
          cp -f "$out/app-release.apk"              "eiermann-${v}-universal.apk"
          cp -f "$out/app-arm64-v8a-release.apk"    "eiermann-${v}-arm64-v8a.apk"
          cp -f "$out/app-armeabi-v7a-release.apk"  "eiermann-${v}-armeabi-v7a.apk"
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "eiermann-${v}-universal.apk" \
            "eiermann-${v}-arm64-v8a.apk" \
            "eiermann-${v}-armeabi-v7a.apk"
