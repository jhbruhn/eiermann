# eiermann — DEV-ONLY OIDC profile. Adds a throwaway mock OpenID provider so the
# OAuth2 sign-in path (eiermann-h7q.18) can be exercised end to end without a
# real identity provider. NEVER use this in production: the client secret is in
# this file, and the mock signs a token for anybody who types an address.
#
# The override is auto-loaded only when no `-f` is given, so list all three:
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.override.yml \
#                  -f docker-compose.oidc.yml up --build
#
# Then open http://localhost:8091 and use "Mock SSO". At the mock's login page
# the "username" box becomes the token's `sub` and NOTHING ELSE: this mock
# derives no email claim from it and never sends `email_verified`. Both matter,
# and both were measured here rather than assumed —
#
#   no `email`          → 400, `email: cannot be blank`. The hook refuses an
#                         account with no address, because every audit-shaped
#                         row stores a text snapshot of its author.
#   no `email_verified` → PocketBase will not LINK the identity to an existing
#                         account and tries to create a second one, which dies
#                         on the unique index: 400, `email: Value must be
#                         unique`. Unverified is the right default — an IdP that
#                         lets anyone type any address could otherwise claim
#                         somebody else's account.
#
# So spell both out in the claims box, alongside the groups:
#
#   {"email":"a@b.test","email_verified":true,"groups":["tauben-koordination"]}
#       → a coordinator
#   {"email":"a@b.test","email_verified":true,"groups":["tauben-team"]}
#       → a member
#   {"email":"a@b.test","email_verified":true}
#       → a GUEST: signed in, and refused by every access rule until a
#         coordinator lets them in
#
# A real OIDC provider sends both on its own once the `email` scope is asked for
# — which /api/eiermann/info prescribes and the app passes through. This is a
# property of the mock, not of the flow.
#
# An address that already has an account links the identity to it instead of
# creating a second — that is the ordinary case for a team switching to a
# provider, and it is the path that needs `email_verified` above. For a private
# IdP that genuinely never sends it, EIERMANN_OIDC_TRUST_EMAIL=true is the
# deliberate opt-in.
#
# Adapted from federfall's file. The group names below are the ones the claims
# examples above use; a real instance names its own.
#
# Why network_mode: the mock derives its issuer from the request Host header, so
# the browser (on the host) and PocketBase (in its container) have to reach it at
# the SAME address. Sharing the app's network namespace makes both use
# localhost:9080, which gives one consistent issuer.

services:
  eiermann:
    # Publish the mock's port from the app's namespace (the mock shares it), so
    # localhost:9080 resolves to the mock for the browser and for PocketBase.
    ports:
      - "9080:9080"
    environment:
      EIERMANN_OAUTH2_PROVIDERS: "oidc"
      EIERMANN_OAUTH2_OIDC_CLIENT_ID: "eiermann"
      EIERMANN_OAUTH2_OIDC_CLIENT_SECRET: "dev-secret"
      EIERMANN_OAUTH2_OIDC_DISPLAY_NAME: "Mock SSO"
      EIERMANN_OAUTH2_OIDC_AUTH_URL: "http://localhost:9080/eiermann/authorize"
      EIERMANN_OAUTH2_OIDC_TOKEN_URL: "http://localhost:9080/eiermann/token"
      EIERMANN_OAUTH2_OIDC_USERINFO_URL: "http://localhost:9080/eiermann/userinfo"
      EIERMANN_OAUTH2_OIDC_PKCE: "true"
      # Map the mock's groups onto roles, so the claims examples in the header
      # actually land somewhere. An unmapped sign-in becomes a guest.
      EIERMANN_OIDC_COORDINATOR_GROUP: "tauben-koordination"
      EIERMANN_OIDC_MEMBER_GROUP: "tauben-team"

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: eiermann_oidc
    # Share the app's network namespace so the issuer is the same localhost:9080
    # everywhere (see the header). The port is published by `eiermann` above.
    network_mode: "service:eiermann"
    environment:
      SERVER_PORT: "9080"
    restart: unless-stopped
