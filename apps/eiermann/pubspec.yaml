name: eiermann
description: Eiermann — Gelegemanagement für Stadttauben
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

# Part of the Eiermann pub workspace (see ../../pubspec.yaml).
resolution: workspace

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.2.0
  csv: ^8.0.0
  # The iOS target's default icon font; without it the web build warns that
  # CupertinoIcons is referenced but not bundled.
  cupertino_icons: ^1.0.8
  eiermann_data:
    path: ../../packages/eiermann_data
  eiermann_models:
    path: ../../packages/eiermann_models
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.0.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  http: ^1.3.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  package_info_plus: ^10.2.0
  pocketbase: ^0.24.0
  riverpod_annotation: ^4.0.3
  share_plus: ^13.2.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  web: ^1.1.1
  # The shared library, pinned by COMMIT HASH — nothing in zugvogel is released,
  # and a hash is the only ref that cannot move.
  zugvogel_core:
    git:
      url: https://github.com/jhbruhn/zugvogel.git
      ref: c9f03bbe11a4acb9e9c04faf48554a3800624b50
      path: packages/zugvogel_core
  zugvogel_data:
    git:
      url: https://github.com/jhbruhn/zugvogel.git
      ref: c9f03bbe11a4acb9e9c04faf48554a3800624b50
      path: packages/zugvogel_data
  zugvogel_pb_client:
    git:
      url: https://github.com/jhbruhn/zugvogel.git
      ref: c9f03bbe11a4acb9e9c04faf48554a3800624b50
      path: packages/zugvogel_pb_client
  zugvogel_ui:
    git:
      url: https://github.com/jhbruhn/zugvogel.git
      ref: c9f03bbe11a4acb9e9c04faf48554a3800624b50
      path: packages/zugvogel_ui

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
